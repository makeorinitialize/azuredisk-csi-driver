{{- if .Values.deviceUse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.controller.name }}-device-use
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.controller.name }}
  ports:
    - name: tls
      port: {{ .Values.controller.deviceUsePort }}
      targetPort: device-use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.controller.name }}-device-use
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames:
      - {{ .Values.deviceUse.journalConfigMap }}
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.controller.name }}-device-use
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.controller.name }}-device-use
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.controller }}
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.node }}
    namespace: {{ .Release.Namespace }}
{{- end }}
